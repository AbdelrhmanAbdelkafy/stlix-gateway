<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأفكار والمتطلبات — Stlix Gateway</title>
<style>
:root{color-scheme:light dark;--bg:#0e131a;--card:#151c26;--card2:#1b2431;--ln:#232e3d;--tx:#e9edf3;--sub:#7e8ba0;--ac:#2bc4c4;--acd:#0a6a6a;--ok:#2fbd6b;--warn:#e0a53a;--plan:#8497b0}
@media(prefers-color-scheme:light){:root{--bg:#f5f7f8;--card:#fff;--card2:#eef1f4;--ln:#e3e7ec;--tx:#131922;--sub:#6a7688;--ac:#0c8a8a;--acd:#0a6a6a;--ok:#15914b;--warn:#c07a0a;--plan:#5b6b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,Tahoma,sans-serif;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px}
.hero{background:#0b121c;color:#eaf2f2;border-radius:0 0 22px 22px;padding:22px 24px 24px;margin-bottom:0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--acd));display:grid;place-items:center;color:#fff;font-weight:800}
h1{font-size:21px;margin:0;font-weight:800}.tag{color:#9fb4b4;font-size:12.5px}
.back{color:#7ee3e3;font-size:12px;text-decoration:none;margin-inline-start:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:15px}
.kpi{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:9px 12px}
.kpi .v{font-size:19px;font-weight:800}.kpi .l{font-size:10.5px;color:#9fb4b4}
.bar{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--ln);padding:11px 0 10px;margin-bottom:16px}
.bar .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:200px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 13px;color:var(--tx);font:inherit;font-size:13.5px}
#q:focus{outline:none;border-color:var(--ac)}
.pill{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub)}
.pill.on{background:var(--ac);border-color:var(--ac);color:#04211f}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:3px 9px;font-size:11.5px;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--acd);border-color:var(--ac);color:#fff}
.chip b{color:var(--tx);font-weight:700}.chip.on b{color:#fff}
.count{font-size:11.5px;color:var(--sub);margin-top:8px}
.count b{color:var(--ac)}
.count .clr{color:var(--warn);cursor:pointer;text-decoration:underline;margin-inline-start:8px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ac);margin:26px 0 2px;font-weight:700;display:flex;align-items:baseline;gap:8px}
h2 .n{color:var(--sub);font-size:11px;letter-spacing:0}
.h2ar{font-size:16.5px;font-weight:800;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.idea{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:13px;padding:12px 14px;transition:transform .1s,border-color .1s}
.idea:hover{transform:translateY(-2px);border-color:var(--ac)}
.idea:target{border-color:var(--ac);box-shadow:0 0 0 3px rgba(43,196,196,.25)}
.idea .top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.idea .id{font-size:10.5px;font-weight:800;background:var(--card2);border:1px solid var(--ln);border-radius:6px;padding:1px 7px;color:var(--sub);font-family:ui-monospace,monospace}
.idea .t{font-size:13.5px;font-weight:600;line-height:1.5}
.idea .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.b{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-live{background:rgba(47,189,107,.15);color:var(--ok)}
.b-next{background:rgba(224,165,58,.17);color:var(--warn)}
.b-planned{background:rgba(132,151,176,.15);color:var(--plan)}
.b-ready{background:rgba(47,189,107,.13);color:var(--ok)}
.b-blocked{background:rgba(200,90,90,.15);color:#d9756f}
.b-src{background:var(--card2);color:var(--sub);border:1px solid var(--ln)}
.b-eng{background:rgba(43,196,196,.15);color:var(--ac)}
.idea .need{font-size:11px;color:#d9756f;margin-top:7px;font-weight:600}
.idea .need.ok{color:var(--sub);font-weight:400}
.idea .note{font-size:11px;color:var(--sub);margin-top:7px;border-top:1px dashed var(--ln);padding-top:6px}
.idea .go{font-size:11px;color:var(--ac);margin-top:7px;font-weight:700}
.empty{text-align:center;color:var(--sub);padding:50px 0;font-size:14px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--ln);font-size:11px;color:var(--sub);text-align:center;line-height:1.9}
.foot code{background:var(--card2);padding:1px 6px;border-radius:5px}
</style></head><body>

<div class="hero"><div class="wrap" style="padding-bottom:0">
  <div class="brand">
    <div class="logo">SG</div>
    <div><h1>الأفكار والمتطلبات</h1><div class="tag">كل فكرة قلتها — لينك تقدر تفتحه · المصدر <code>BACKLOG.md</code></div></div>
    <a class="back" href="/tools/platform">← الهَب</a>
  </div>
  <div class="kpis" id="kpis"></div>
</div></div>

<div class="wrap">
  <div class="bar">
    <div class="row">
      <input id="q" type="search" placeholder="دوّر على أي فكرة… (اكتب / للتركيز)" autocomplete="off">
      <button class="pill on" data-rd="" data-reset="1">الكل</button>
      <button class="pill" data-rd="done">✅ اتعمل</button>
      <button class="pill" data-rd="ready">🟢 الكنكتور جاهز</button>
      <button class="pill" data-rd="partial">🟡 كنكتور ناقص</button>
      <button class="pill" data-rd="blocked">⛔ محتاج تكامل جديد</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
  </div>
  <div id="out"></div>
  <div class="foot">
    كل فكرة ليها <b>معرّف ثابت</b> ولينك مباشر — مثال <code>/tools/ideas#T14</code> أو <code>/api/v1/ideas/T14</code>.
    <div>عايز تضيف فكرة؟ ضيف سطر في <code>BACKLOG.md</code> — تظهر هنا فورًا من غير أي تعديل كود.</div>
  </div>
</div>

<script>
var KEY="__GATEWAY_API_KEY__",ALL=[],SUM={},rd="",dom="";

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
// BACKLOG.md is markdown: render the **bold** the owner writes, escape the rest.
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\s*→\s*[^|]+$/,"")}
var LBL={live:"شغّال",next:"التالي",planned:"مخطّط"};
// readiness = can we build it today? (does every connector it needs exist)
var RD={done:["✅ اتعمل","b-live"],ready:["🟢 الكنكتور جاهز","b-ready"],
        partial:["🟡 كنكتور ناقص","b-next"],blocked:["⛔ محتاج تكامل جديد","b-blocked"]};
var CONN={nama:"نما",crm:"CRM (Vtiger)",sql:"نما SQL",gateway:"الجيتواي","front-end":"واجهة",
  "all-connectors":"كل الكنكتورات","ai-layer":"طبقة الذكاء (Layer 4)","new-system":"نظام جديد",
  external:"API خارجي",email:"إيميل",omnichannel:"واتساب/وي شات",voice:"صوت عربي",sso:"SSO",
  portal:"بوابة حكومية",telco:"شركة اتصالات",custody:"العهدة","bank-feed":"تغذية بنكية"};

function kpis(){
  var r=SUM.readiness||{};
  var k=[[SUM.total,"إجمالي الأفكار"],[r.done,"✅ اتعمل"],[r.ready,"🟢 كنكتوره جاهز"],
         [r.partial,"🟡 ناقص جزء"],[r.blocked,"⛔ محتاج تكامل"],[SUM.domains,"دومين"]];
  document.getElementById("kpis").innerHTML=k.map(function(p){
    return '<div class="kpi"><div class="v">'+(p[0]==null?"—":p[0])+'</div><div class="l">'+p[1]+'</div></div>'
  }).join("");
}

function chips(doms){
  document.getElementById("chips").innerHTML=
    '<span class="chip'+(dom===""?" on":"")+'" data-d="">كل الدومينات <b>'+ALL.length+'</b></span>'+
    doms.map(function(d){
      return '<span class="chip'+(dom===d.prefix?" on":"")+'" data-d="'+d.prefix+'">'+d.icon+" "+esc(d.domain)+' <b>'+d.total+'</b></span>'
    }).join("");
}

function card(i){
  var planned=i.status==="planned";
  var r=RD[i.readiness]||RD.blocked;
  var go = planned
    ? (i.related?'<div class="go">↪ أقرب حاجة موجودة: '+esc(i.related)+'</div>':"")
    : '<div class="go">← افتحها</div>';
  // Name what is missing — that is the actual answer to "why isn't this built".
  var need = i.missing_connectors.length
    ? '<div class="need">ناقص: '+i.missing_connectors.map(function(c){return esc(CONN[c]||c)}).join(" · ")+'</div>'
    : (i.connectors.length?'<div class="need ok">الكنكتور موجود: '+i.connectors.map(function(c){return esc(CONN[c]||c)}).join(" · ")+'</div>':"");
  return '<a class="idea" id="'+esc(i.id)+'" href="'+esc(planned&&i.related?i.related:i.link)+'">'+
    '<div class="top"><span class="id">'+esc(i.id)+'</span><span>'+i.icon+'</span></div>'+
    '<div class="t">'+fmt(i.title)+'</div>'+
    '<div class="meta"><span class="b '+r[1]+'">'+r[0]+'</span>'+
      '<span class="b b-src">'+esc(i.source)+'</span>'+
      (i.engine?'<span class="b b-eng">⚙ '+esc(i.engine)+'</span>':"")+
    '</div>'+need+
    (i.note?'<div class="note">'+fmt(i.note)+'</div>':"")+go+'</a>';
}

function render(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  var rows=ALL.filter(function(i){
    if(rd&&i.readiness!==rd)return false;
    if(dom&&i.prefix!==dom)return false;
    if(!q)return true;
    return (i.id+" "+i.title+" "+i.domain+" "+i.domain_en+" "+i.source+" "+(i.engine||"")).toLowerCase().indexOf(q)>-1;
  });
  // Filters are easy to forget you set — always say what is being hidden.
  var active=(rd?1:0)+(dom?1:0)+(q?1:0);
  document.getElementById("count").innerHTML=
    "بيظهر <b>"+rows.length+"</b> من "+ALL.length+
    (active?' <span class="clr" id="clr">امسح الفلاتر</span>':"");
  var c=document.getElementById("clr");
  if(c)c.onclick=function(){resetAll();render()};

  var out=document.getElementById("out");
  if(!rows.length){out.innerHTML='<div class="empty">مفيش نتيجة — جرّب تمسح الفلاتر.</div>';return}
  var groups=[],byPrefix={};
  rows.forEach(function(i){
    if(!byPrefix[i.prefix]){byPrefix[i.prefix]={p:i.prefix,icon:i.icon,ar:i.domain,en:i.domain_en,items:[]};groups.push(byPrefix[i.prefix])}
    byPrefix[i.prefix].items.push(i);
  });
  out.innerHTML=groups.map(function(g){
    return '<h2>'+esc(g.en)+' <span class="n">'+g.items.length+' بند</span></h2>'+
      '<div class="h2ar">'+g.icon+" "+esc(g.ar)+'</div>'+
      '<div class="grid">'+g.items.map(card).join("")+'</div>'
  }).join("");
  if(location.hash){var t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView({block:"center"})}
}

function resetAll(){
  rd="";dom="";document.getElementById("q").value="";
  document.querySelectorAll(".pill").forEach(function(x){x.classList.toggle("on",x.dataset.reset==="1")});
  document.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x.dataset.d==="")});
}

document.getElementById("q").addEventListener("input",render);
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement.id!=="q"){e.preventDefault();document.getElementById("q").focus()}
});
document.querySelectorAll(".pill").forEach(function(b){
  b.addEventListener("click",function(){
    // "الكل" means all — clear the domain chip too, not just the readiness.
    if(b.dataset.reset==="1"){resetAll();render();return}
    document.querySelectorAll(".pill").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");rd=b.dataset.rd;render();
  });
});
document.getElementById("chips").addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;
  dom=c.dataset.d;
  document.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x===c)});
  render();
});

Promise.all([
  fetch("/api/v1/ideas",{headers:{"X-API-Key":KEY}}).then(function(r){return r.json()}),
  fetch("/api/v1/ideas/domains",{headers:{"X-API-Key":KEY}}).then(function(r){return r.json()})
]).then(function(res){
  ALL=res[0].ideas||[];SUM=res[0].summary||{};
  kpis();chips(res[1].domains||[]);render();
}).catch(function(err){
  document.getElementById("out").innerHTML='<div class="empty">تعذّر تحميل الأفكار: '+esc(err.message)+'</div>';
});
</script>
</body></html>
