<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finance OS — النسخة الكاملة (Demo)</title>
<style>
  :root{
    --bg:#f4f6fb;--surface:#fff;--surface-2:#fafbfe;--line:#e8edf5;
    --ink:#0f1b2d;--ink-2:#3d4b60;--muted:#8091a7;
    --primary:#2f5bd0;--primary-d:#2447a8;--primary-soft:#eaf0fd;
    --teal:#0ea5a5;--teal-soft:#e5f7f7;--green:#15a34a;--green-soft:#e7f6ec;
    --amber:#d98a09;--amber-soft:#fdf1dc;--red:#dc2b3d;--red-soft:#fdeaec;
    --blue:#2563eb;--blue-soft:#e8f0fe;--violet:#7c3aed;--violet-soft:#f1e9fe;
    --r:16px;--sh:0 1px 2px rgba(16,30,54,.05),0 10px 30px -12px rgba(16,30,54,.14);--sh-sm:0 1px 2px rgba(16,30,54,.06);
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"side top" "side main";height:100vh}
  /* sidebar */
  .side{grid-area:side;background:#0d1b2e;color:#c3d0e0;display:flex;flex-direction:column;padding:16px 12px}
  .brand{display:flex;gap:11px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
  .brand .m{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--teal));display:grid;place-items:center;color:#fff;font-weight:800}
  .brand b{font-size:15px;color:#fff}.brand small{display:block;color:#7d90a8;font-size:11px}
  .nav{margin-top:12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
  .nav .sec{font-size:10px;color:#61748c;font-weight:700;letter-spacing:.6px;margin:12px 10px 5px}
  .nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#b9c7da;font-size:13.5px}
  .nav button .i{width:18px;text-align:center;font-size:15px}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.on{background:linear-gradient(90deg,rgba(47,91,208,.35),rgba(14,165,165,.16));color:#fff;font-weight:600}
  .nav .badge{margin-inline-start:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px}
  .side .foot{margin-top:auto;font-size:10.5px;color:#61748c;padding:10px;border-top:1px solid rgba(255,255,255,.07)}
  /* topbar */
  .top{grid-area:top;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;height:58px}
  .top h1{font-size:17px;margin:0}.top h1 small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .top .sp{margin-inline-start:auto}
  .rolesel{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:inherit;font-size:13px;font-weight:700;color:var(--primary-d)}
  .who{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
  .who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#26334a,#16233a);color:#fff;display:grid;place-items:center;font-weight:700}
  /* main */
  .main{grid-area:main;overflow:auto;padding:22px 24px}
  .view{display:none}.view.on{display:block}
  .row{display:grid;gap:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr!important}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card .hd h3{margin:0;font-size:14.5px}.card .hd .sub{color:var(--muted);font-size:11.5px;font-weight:500;margin-inline-start:auto}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px}
  .kpi .top{display:flex;align-items:center}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-inline-start:auto;font-size:15px}
  .kpi .val{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
  .kpi .d{font-size:11.5px;margin-top:3px;font-weight:600}
  .up{color:var(--green)}.dn{color:var(--red)}
  .g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 16px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;color:var(--muted);background:var(--surface-2);font-weight:700}
  tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface-2)}
  .amt{font-variant-numeric:tabular-nums;font-weight:700}
  .badge2{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .b-DRAFT{background:#eef1f6;color:#5b6b82}.b-SUBMITTED{background:var(--amber-soft);color:#9a6206}
  .b-APPROVED{background:var(--blue-soft);color:#1d4ed8}.b-POSTED{background:var(--green-soft);color:#0f7a37}.b-REJECTED{background:var(--red-soft);color:#b41b2c}
  .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .st.paid{background:var(--green-soft);color:#0f7a37}.st.over{background:var(--red-soft);color:#b41b2c}
  .st.open{background:var(--blue-soft);color:#1d4ed8}.st.part{background:var(--amber-soft);color:#9a6206}.st.rcpt{background:var(--teal-soft);color:#0a7d7d}
  .btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:9px;display:inline-flex;gap:6px;align-items:center}
  .btn.pr{background:var(--primary);color:#fff}.btn.pr:hover{background:var(--primary-d)}
  .btn.ap{background:var(--green-soft);color:#0f7a37;border:1px solid #c3ecd0}.btn.ap:hover{background:#15803d;color:#fff}
  .btn.rj{background:var(--red-soft);color:#b41b2c;border:1px solid #f6c9c9}.btn.rj:hover{background:#b41b2c;color:#fff}
  .btn.gh{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.gh:hover{background:#eef2f9}
  .btn:disabled{opacity:.4;cursor:not-allowed}.acts{display:flex;gap:6px}
  .lock{background:#fff7ed;border:1px dashed #fdba74;color:#b45309;padding:13px 15px;border-radius:12px;font-size:13px}
  .hint{font-size:11.5px;color:var(--muted);padding:6px 18px 14px}.denied{font-size:12px;color:var(--red)}
  .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{background:var(--teal-soft);color:#0a6f6f;border:1px solid #cdeeee;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:600}
  /* chat */
  .chat{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:340px}
  .thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;gap:9px;max-width:82%}.msg .a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:0 0 auto}
  .msg .b{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:9px 13px}.msg .nm{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .msg.me{margin-inline-start:auto;flex-direction:row-reverse}.msg.me .b{background:var(--primary);color:#fff;border-color:var(--primary)}.msg.me .a{background:#26334a}
  .cbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px}
  .cbar button{all:unset;cursor:pointer;background:var(--primary-soft);color:var(--primary-d);border:1px solid #d4e0fb;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
  .comp{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px}
  .comp input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:11px;font:inherit}
  .comp .snd{all:unset;cursor:pointer;background:var(--primary);color:#fff;font-weight:800;padding:10px 16px;border-radius:11px}
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px}
  .agc{border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center;background:var(--surface-2)}
  .agc .a{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:800}
  .agc .nm{font-weight:700;font-size:12.5px}.agc .tt{font-size:10.5px;color:var(--muted)}
  .rec{border:1px solid var(--line);border-radius:12px;padding:13px;margin:0 16px 11px;display:flex;gap:11px}
  .rec .sv{width:6px;border-radius:6px}.rec .tl{font-weight:800;font-size:13.5px}.rec .dt{font-size:12px;color:#475569;margin-top:2px}
  .rec .mt{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
  .t-PENDING_APPROVAL{background:var(--amber-soft);color:#9a6206}.t-AUTO_DECIDED{background:var(--blue-soft);color:#1d4ed8}
  .t-APPROVED{background:var(--green-soft);color:#0f7a37}.t-DISMISSED{background:#eef1f6;color:#5b6b82}
  /* aging bar / mini charts */
  .agebar{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:6px 18px 10px}.agebar i{display:block;height:100%}
  .leg{display:flex;flex-wrap:wrap;gap:12px;padding:0 18px 14px}.leg .li{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--ink-2)}.leg .sw{width:11px;height:11px;border-radius:3px}
  .bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding:16px 18px}
  .bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bars .bar i{width:70%;background:linear-gradient(180deg,var(--primary),#5b82e0);border-radius:6px 6px 0 0}
  .bars .bar span{font-size:10.5px;color:var(--muted)}
  .list360{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media(max-width:1000px){.list360{grid-template-columns:1fr}}
  .crow{display:flex;gap:10px;align-items:center;padding:10px;border-radius:11px;cursor:pointer;border:1px solid transparent}
  .crow:hover{background:var(--surface-2)}.crow.sel{background:var(--primary-soft);border-color:#d4e0fb}
  .crow .cv{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
  .crow .nm{font-weight:700;font-size:13px}.crow .mt{font-size:11px;color:var(--muted)}.crow .bl{margin-inline-start:auto;font-size:12px;font-weight:800;text-align:left}
  .info .r{display:flex;justify-content:space-between;padding:9px 18px;border-bottom:1px dashed var(--line);font-size:13px}.info .k{color:var(--muted)}
  .src{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:#0a7d7d;background:var(--teal-soft);padding:2px 8px;border-radius:999px}
  .src.crm{color:#2447a8;background:var(--primary-soft)}
  #toast{position:fixed;bottom:20px;inset-inline-start:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{background:#0d1b2e;color:#fff;padding:11px 15px;border-radius:11px;font-size:13px;box-shadow:var(--sh);border-inline-start:4px solid var(--teal)}.toast.ok{border-inline-start-color:var(--green)}.toast.er{border-inline-start-color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="m">FO</div><div><b>Finance OS</b><small>النسخة الكاملة · Demo</small></div></div>
    <nav class="nav" id="nav">
      <div class="sec">الرئيسية</div>
      <button data-v="dash" class="on"><span class="i">▦</span> لوحة المعلومات</button>
      <button data-v="team"><span class="i">🤖</span> الفريق المالي الذكي</button>
      <div class="sec">العمليات المالية</div>
      <button data-v="ap"><span class="i">🧾</span> فواتير الموردين (AP)</button>
      <button data-v="cust"><span class="i">👥</span> العملاء 360°</button>
      <button data-v="cash"><span class="i">🏦</span> الخزينة والنقد</button>
      <button data-v="ledger"><span class="i">📚</span> الأستاذ العام (GL)</button>
      <div class="sec">التحليل والحوكمة</div>
      <button data-v="reports"><span class="i">📊</span> التقارير و KPIs</button>
      <button data-v="audit"><span class="i">🛡️</span> سجل التدقيق</button>
    </nav>
    <div class="foot">ERP = System of Record · الذكاء الاصطناعي لا يكتب في ERP مباشرة · كل إجراء عبر Workflow مُدقّق.</div>
  </aside>

  <header class="top">
    <h1 id="pt">لوحة المعلومات<small id="ps">نظرة تنفيذية على أداء المالية</small></h1>
    <div class="sp"></div>
    <span id="lastupd" style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block"></span>آخر تحديث: —</span>
    <label style="font-size:11px;color:var(--muted)">بصفتك:</label>
    <select class="rolesel" id="role">
      <option value="PRESIDENT">الرئيس</option>
      <option value="CFO">المدير المالي (CFO)</option>
      <option value="AP_MANAGER">مدير الحسابات الدائنة</option>
      <option value="AP_CLERK">موظف حسابات دائنة</option>
      <option value="OPERATOR">المُشغّل (إدخال البيانات)</option>
      <option value="AUDITOR">مدقّق داخلي</option>
    </select>
    <div class="who"><span id="uname">الرئيس</span><div class="av" id="uav">ا</div></div>
  </header>

  <main class="main">
    <div class="view on" id="v-dash"></div>
    <div class="view" id="v-team"></div>
    <div class="view" id="v-ap"></div>
    <div class="view" id="v-cust"></div>
    <div class="view" id="v-cash"></div>
    <div class="view" id="v-ledger"></div>
    <div class="view" id="v-reports"></div>
    <div class="view" id="v-audit"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ===== roles ===== */
const PERM={CFO:new Set(["inv:read","cash:read","team","rec:decide","audit","ledger"]),
  AP_MANAGER:new Set(["inv:read","inv:approve","inv:post","team","ledger"]),
  AP_CLERK:new Set(["inv:read","inv:create","inv:submit","team"]),
  AUDITOR:new Set(["inv:read","audit","team","ledger"]),
  // المُشغّل (operator): بيدخّل/يغذّي المعلومات — إنشاء وإرسال، بدون اعتماد (فصل واجبات)
  OPERATOR:new Set(["inv:read","inv:create","inv:submit","team","ledger"]),
  // الرئيس: بيشوف كل حاجة + بيقرّر + بتحصل نقاشات معاه (شات الفريق) — رؤية تنفيذية كاملة
  PRESIDENT:new Set(["inv:read","inv:approve","cash:read","team","rec:decide","audit","ledger"])};
const RMETA={CFO:{id:1,n:"ليلى حسن"},AP_MANAGER:{id:3,n:"سمير مدير"},AP_CLERK:{id:4,n:"أحمد موظف"},AUDITOR:{id:5,n:"هدى مدقّق"},
  OPERATOR:{id:6,n:"المُشغّل"},PRESIDENT:{id:7,n:"الرئيس"}};
let role="PRESIDENT"; const can=p=>PERM[role].has(p); const meId=()=>RMETA[role].id;

/* ===== agents ===== */
const AG={cfo:{n:"ليلى حسن",t:"المدير المالي",a:"ل",c:"#0f2a47"},treasury:{n:"عمر فهمي",t:"الخزينة",a:"ع",c:"#0ea5a5"},
 controller:{n:"سارة نبيل",t:"المراقب المالي",a:"س",c:"#2563eb"},ap:{n:"خالد عادل",t:"الحسابات الدائنة",a:"خ",c:"#7c3aed"},
 ar:{n:"منى صلاح",t:"الحسابات المدينة",a:"م",c:"#db2777"},cost:{n:"طارق سمير",t:"التكاليف",a:"ط",c:"#ea580c"},
 tax:{n:"يوسف كمال",t:"الضرائب",a:"ي",c:"#0891b2"},audit:{n:"هنا وائل",t:"التدقيق الداخلي",a:"ه",c:"#65a30d"}};

/* ===== data ===== */
const TODAY=new Date("2026-07-22"); const C=["#2f5bd0","#0ea5a5","#7c3aed","#db2777","#ea580c"];
const banks=[{n:"Main Operating",b:"CIB",ac:"****4021",cc:"EGP",v:4823000},{n:"Payroll",b:"HSBC",ac:"****8830",cc:"EGP",v:962000},
 {n:"FX Reserve",b:"QNB",ac:"****1176",cc:"USD",v:210000},{n:"Local Ops",b:"Banque Misr",ac:"****5590",cc:"EGP",v:1315000}];
const vendors=[{id:1,n:"شركة أكمي"},{id:2,n:"النيل للتجارة"},{id:3,n:"دلتا لوجيستيك"}];
let invSeq=5, invoices=[
 {id:1,no:"INV-1001",v:1,amt:25000,st:"DRAFT",by:4},{id:2,no:"INV-1002",v:2,amt:48000,st:"SUBMITTED",by:4},
 {id:3,no:"INV-1003",v:1,amt:152000,st:"APPROVED",by:4},{id:4,no:"INV-1004",v:3,amt:9000,st:"POSTED",by:4,erp:"ERP-9F2A6C71"},
 {id:5,no:"INV-1005",v:2,amt:33000,st:"REJECTED",by:4}];
const customers=[
 {id:1,n:"شركة أكمي للتوريدات",code:"CUST-001",owner:"منى صلاح",phone:"0100 111 2233",city:"القاهرة",
  led:[{no:"SI-100231",k:"فاتورة",d:"2026-05-02",due:"2026-06-01",dr:48000,cr:0},{no:"RV-90012",k:"سند قبض",d:"2026-06-03",due:"",dr:0,cr:30000},
       {no:"SI-100288",k:"فاتورة",d:"2026-07-10",due:"2026-08-09",dr:52000,cr:0}]},
 {id:2,n:"النيل للتجارة",code:"CUST-002",owner:"خالد عادل",phone:"0122 333 4455",city:"الإسكندرية",
  led:[{no:"SI-100240",k:"فاتورة",d:"2026-06-28",due:"2026-07-28",dr:28000,cr:0},{no:"RV-90020",k:"سند قبض",d:"2026-07-05",due:"",dr:0,cr:15000}]},
 {id:3,n:"دلتا لوجيستيك",code:"CUST-003",owner:"منى صلاح",phone:"0111 777 8899",city:"الجيزة",
  led:[{no:"SI-100261",k:"فاتورة",d:"2026-04-15",due:"2026-05-15",dr:22000,cr:0}]}];
let recSeq=5, recs=[
 {id:1,ag:"treasury",tl:"فائض نقدي غير مستثمر",dt:"رصيد تشغيلي أعلى من الحد؛ يُقترح وديعة 30 يوماً.",sv:"HIGH",st:"PENDING_APPROVAL"},
 {id:2,ag:"tax",tl:"استحقاق ض.ق.م خلال 6 أيام",dt:"مراجعة المرفقات واعتماد السداد.",sv:"HIGH",st:"PENDING_APPROVAL"},
 {id:3,ag:"ap",tl:"جدولة دفعة موردين",dt:"فواتير معتمدة قاربت الاستحقاق.",sv:"MEDIUM",st:"PENDING_APPROVAL"},
 {id:4,ag:"ap",tl:"منع فاتورة مكررة",dt:"أوقف الفريق إدخالاً مكرراً تلقائياً.",sv:"LOW",st:"AUTO_DECIDED"},
 {id:5,ag:"controller",tl:"تنبيه فواتير > 10,000",dt:"فُعّل تلقائياً للعرض على الاعتماد.",sv:"LOW",st:"AUTO_DECIDED"}];
const ledger=[
 {no:"JV-2201",d:"2026-07-20",desc:"إثبات فاتورة مورد INV-1004",dr:"مصروفات تشغيل",cr:"موردون",amt:9000},
 {no:"JV-2202",d:"2026-07-19",desc:"تحصيل من عميل النيل",dr:"البنك",cr:"عملاء",amt:15000},
 {no:"JV-2203",d:"2026-07-18",desc:"إثبات مبيعات أكمي",dr:"عملاء",cr:"إيرادات",amt:52000}];

 c.led.filter(l=>l.dr>0).sort((a,z)=>new Date(a.d)-new Date(z.d)).forEach(inv=>{const ap=Math.min(credit,inv.dr);credit-=ap;const rem=inv.dr-ap;if(rem<=0)return;
  const ov=Math.max(0,Math.round((TODAY-new Date(inv.due))/864e5));if(ov<=0)b.cur+=rem;else if(ov<=30)b.d30+=rem;else if(ov<=60)b.d60+=rem;else b.d90+=rem;});});return b;}

function route(m){m=(m||"").toLowerCase();
 if(/نقد|بنك|رصيد|سيول|cash|bank/.test(m))return"treasury";
 if(/مورد|فاتور|دائن|payable|invoice/.test(m))return"ap";
 if(/عميل|تحصيل|مدين|receivable/.test(m))return"ar";
 if(/ضريب|tax/.test(m))return"tax";if(/تدقيق|audit/.test(m))return"audit";return"cfo";}

  const c=cash();return{a,r:`معك ${a.n}. السيولة: ${M(c.egp)} + ${M(c.usd,"USD")}. تحب توقّع تدفق نقدي 30/60/90؟`};}
 if(k==="ap"){const p=payables();return{a,r:`معك ${a.n}. ${p.pend} فاتورة تنتظر الاعتماد (${M(p.pendAmt)})، وإجمالي مفتوح ${M(p.open)}.`};}
 if(k==="ar")return{a,r:`معك ${a.n}. إجمالي المديونيات على العملاء ${M(receivables())}. أجهّز أولويات التحصيل عند الطلب.`};
 if(k==="tax")return{a,r:`معك ${a.n}. إقرار ض.ق.م مستحق خلال 6 أيام — أجهّز الملخّص والمرفقات؟`};
 if(k==="audit"){if(!can("audit"))return{a,r:`معك ${a.n}. تفاصيل التدقيق مقصورة على audit:read، لكن كل إجراء مُوثّق.`};

 const arcs=parts.map(p=>{const len=p.v/tot*Cc;const s=`<circle r="${R}" cx="68" cy="68" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${Cc-len}" stroke-dashoffset="${-off}" transform="rotate(-90 68 68)"/>`;off+=len;return s;}).join("");
 return `<svg width="136" height="136" viewBox="0 0 136 136">${arcs}<circle r="34" cx="68" cy="68" fill="#fff"/><text x="68" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f1b2d">${M(tot,"")}</text></svg>`;}

 <div class="card"><div class="hd"><h3>ملاحظة الأرصدة النقدية</h3></div>

 +(LIVE.banks?`<div style="height:16px"></div><div class="card"><div class="hd"><h3>حسابات البنوك الفعلية <span class="src">نما · حيّ</span></h3><span class="sub">${LIVE.banks.length} حساب من نما</span></div>

 document.getElementById("v-audit").innerHTML=`<div class="card"><div class="hd"><h3>سجل التدقيق (Append-only)</h3><span class="sub">غير قابل للتعديل</span></div>

/* ===== router + role ===== */
const RENDER={dash:vDash,team:vTeam,ap:vAP,cust:vCust,cash:vCash,ledger:vLedger,reports:vReports,audit:vAudit};
const TITLES={dash:["لوحة المعلومات","نظرة تنفيذية على أداء المالية"],team:["الفريق المالي الذكي","دردشة، توصيات، وقرارات (HITL)"],
 ap:["فواتير الموردين","دورة الاعتماد والترحيل"],cust:["العملاء 360°","بيانات CRM + حساب نما موحّدة"],
 cash:["الخزينة والنقد","بيانات مقصورة على الإدارة المالية"],ledger:["الأستاذ العام","قيود اليومية"],
 reports:["التقارير و KPIs","مؤشرات الأداء والتحليل"],audit:["سجل التدقيق","سجل غير قابل للتعديل"]};
let curr="dash";
function go(v){curr=v;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));document.getElementById("v-"+v).classList.add("on");
 document.getElementById("pt").childNodes[0].nodeValue=TITLES[v][0];document.getElementById("ps").textContent=TITLES[v][1];
 RENDER[v]();}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)go(b.dataset.v);});
document.getElementById("role").addEventListener("change",e=>{role=e.target.value;
 document.getElementById("uname").textContent=RMETA[role].n;document.getElementById("uav").textContent=RMETA[role].n.trim()[0];
 toast("أصبحت الآن: "+RMETA[role].n);go(curr);});

/* آخر تحديث (يتعبّى بتاريخ/وقت فتح الصفحة) */
(function(){var d=new Date(),p=n=>String(n).padStart(2,"0");
 var t=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
 document.getElementById("lastupd").innerHTML='<span style="width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block"></span>آخر تحديث: '+t+' · <b style="color:#b45309">بيانات تجريبية — نما غير متصل</b>';})();

/* ===== gateway live data (المفاتيح server-side) ===== */
const GW="/api/v1/", GWH={"X-API-Key":"__GATEWAY_API_KEY__"};
let LIVE={banks:null,customers:null,suppliers:null,kpis:null};
async function gwGet(path){const r=await fetch(GW+path,{headers:GWH});if(!r.ok)throw new Error(path+" HTTP "+r.status);return r.json();}
function setBanner(sources){const el=document.getElementById("lastupd");if(!el)return;
 var d=new Date(),p=n=>String(n).padStart(2,"0");
 var t=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
 if(sources&&sources.length){
  el.innerHTML='<span style="width:7px;height:7px;border-radius:50%;background:#15a34a;display:inline-block"></span>آخر تحديث: '+t+
   ' · <b style="color:#0f7a37">متصل بالجيتواي ✅ ('+sources.join(" · ")+' حيّ)</b>';
 }else{
  el.innerHTML='<span style="width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block"></span>آخر تحديث: '+t+
   ' · <b style="color:#b45309">الجيتواي غير متصل — بيانات تجريبية</b>';
 }}
async function loadLive(){
 const ok=[];
 try{const d=await gwGet("banks?limit=100");const rows=(d.records)||[];
  if(rows.length){LIVE.banks=rows;ok.push("البنوك");}}catch(e){}
 try{const d=await gwGet("finance/kpis");if(d&&d.available){LIVE.kpis=d;ok.push("KPIs");}}catch(e){}
 try{const d=await gwGet("finance/customers?limit=200");const rows=(d.records)||[];
  if(rows.length){LIVE.customers=rows;ok.push("العملاء");}}catch(e){}
 try{const d=await gwGet("finance/suppliers?limit=100");const rows=(d.records)||[];
  if(rows.length){LIVE.suppliers=rows;ok.push("الموردين");}}catch(e){}
 setBanner(ok);
 if(ok.length)go(curr);   // re-render current view with live overlays
}

/* boot */
go("dash");
loadLive();
</script>
