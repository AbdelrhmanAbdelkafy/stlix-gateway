<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F1C2E">
<title>كلمة مرور جديدة — STLIX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Almarai:wght@700;800&display=swap">
<style>
:root{--bg:#0F1C2E;--card:#131C2B;--line:#26344A;--tx:#E9EDF3;--sub:#8E9BB0;--gold:#E0A53A;--gold2:#B9770E;--red:#E56A5C;--red-bg:#3A1A17;--green:#3BC77A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.55;display:grid;place-items:center;padding:24px;min-height:100vh;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.card{position:relative;width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-family:"Almarai";font-weight:800;color:#0F1C2E;font-size:22px}
h1{font-family:"Almarai";font-size:21px;margin:0}
.brand small{display:block;font-size:12px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;direction:ltr;text-align:right}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.f{position:relative}
input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;outline:none;direction:ltr;text-align:left}
input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
.eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sub);cursor:pointer;font-size:16px;padding:4px}
button.go{width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:12px;border:0;background:var(--gold);color:#0F1C2E;cursor:pointer}
button.go:hover{background:#f0b64a} button.go:disabled{opacity:.6;cursor:not-allowed}
.rule{margin-top:8px;font-size:12.5px;color:var(--sub)} .rule.ok{color:var(--green)}
.msg{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:600}
.msg.err{display:block;background:var(--red-bg);color:var(--red);border:1px solid rgba(229,106,92,.35)}
.msg.ok{display:block;background:#10291B;color:var(--green);border:1px solid rgba(59,199,122,.3)}
.foot{margin-top:18px;font-size:12.5px;color:var(--sub);text-align:center}
.foot a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">S</div><div><h1>كلمة مرور جديدة</h1><small>STLIX Hub</small></div></div>
  <div id="body" hidden>
    <form id="f">
      <label for="p1">كلمة المرور الجديدة</label>
      <div class="f"><input id="p1" type="password" autocomplete="new-password" required>
        <button type="button" class="eye" id="eye" aria-label="إظهار">👁</button></div>
      <div class="rule" id="r1">8 حروف على الأقل</div>
      <label for="p2">اكتبها تاني</label>
      <div class="f"><input id="p2" type="password" autocomplete="new-password" required></div>
      <div class="rule" id="r2">لازم الاتنين يبقوا نفس الحاجة</div>
      <button class="go" type="submit" id="go" disabled>احفظ وادخل</button>
    </form>
  </div>
  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/login">← تسجيل الدخول</a> · <a href="/forgot">اطلب لينك جديد</a></div>
</div>
<script>
(function(){
  var t=new URLSearchParams(location.search).get('t')||'';
  var msg=document.getElementById('msg'), body=document.getElementById('body'),
      p1=document.getElementById('p1'), p2=document.getElementById('p2'),
      go=document.getElementById('go'), r1=document.getElementById('r1'), r2=document.getElementById('r2');

  function dead(text){ msg.className='msg err'; msg.textContent=text; body.hidden=true; }

  if(!t){ dead('اللينك ناقص — افتحه من الرسالة زي ما هو.'); return; }
  fetch('/api/v1/auth/reset/check?t='+encodeURIComponent(t),{headers:{accept:'application/json'}})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.valid){ dead('اللينك مش صالح أو انتهت مدته — اطلب واحد جديد من «نسيت كلمة السر».'); return; }
      body.hidden=false;
      var left=Math.max(0,Math.round((d.expires_at*1000-Date.now())/60000));
      msg.className='msg ok'; msg.textContent='اللينك صالح — فاضل حوالي '+left+' دقيقة.';
    })
    .catch(function(){ dead('مش قادر أوصل للسيرفر — جرّب تاني.'); });

  function check(){
    var a=p1.value, b=p2.value, longEnough=a.length>=8, same=a&&a===b;
    r1.className='rule'+(longEnough?' ok':''); r1.textContent=longEnough?'الطول تمام':'8 حروف على الأقل';
    r2.className='rule'+(same?' ok':''); r2.textContent=same?'متطابقين':'لازم الاتنين يبقوا نفس الحاجة';
    go.disabled=!(longEnough&&same);
  }
  p1.oninput=check; p2.oninput=check;
  document.getElementById('eye').onclick=function(){p1.type=p1.type==='password'?'text':'password';};

  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault(); go.disabled=true;
    fetch('/api/v1/auth/reset',{method:'POST',
      headers:{'Content-Type':'application/json',accept:'application/json'},
      body:JSON.stringify({token:t,password:p1.value})})
      .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
      .then(function(res){
        if(res.s>=400){ go.disabled=false; msg.className='msg err';
          msg.textContent=res.j.detail||'مانفعش — جرّب تاني.'; return; }
        body.hidden=true; msg.className='msg ok';
        msg.textContent='اتغيّرت. كل الجلسات القديمة اتقفلت — ادخل بالجديدة.';
        setTimeout(function(){location.href='/login';},2500);
      })
      .catch(function(){ go.disabled=false; msg.className='msg err';
        msg.textContent='مش قادر أوصل للسيرفر — جرّب تاني.'; });
  });
})();
</script>
</body>
</html>
