<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1C2E">
<title>تسجيل الدخول — STLIX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Almarai:wght@700;800&display=swap">
<style>
:root{--bg:#0F1C2E;--card:#131C2B;--line:#26344A;--tx:#E9EDF3;--sub:#8E9BB0;--gold:#E0A53A;--gold2:#B9770E;--red:#E56A5C;--red-bg:#3A1A17;--green:#3BC77A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.5;display:grid;place-items:center;padding:24px;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.card{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-family:"Almarai";font-weight:800;color:#0F1C2E;font-size:22px}
h1{font-family:"Almarai";font-size:22px;margin:0}
.brand small{display:block;font-size:12px;color:var(--sub);letter-spacing:.1em;text-transform:uppercase;font-family:"IBM Plex Sans","Segoe UI",sans-serif;direction:ltr;text-align:right}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.f{position:relative}
input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;outline:none;direction:ltr;text-align:left}
input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
.eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--sub);cursor:pointer;font-size:16px;padding:4px}
button.go{width:100%;margin-top:20px;font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:12px;border:0;background:var(--gold);color:#0F1C2E;cursor:pointer}
button.go:hover{background:#f0b64a} button.go:disabled{opacity:.6;cursor:wait}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.msg.err{display:block;background:var(--red-bg);color:var(--red);border:1px solid rgba(229,106,92,.35)}
.msg.ok{display:block;background:#10291B;color:var(--green)}
.foot{margin-top:18px;font-size:12px;color:var(--sub);text-align:center}
.foot .en{font-family:"IBM Plex Sans","Segoe UI",sans-serif;direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<form class="card" method="post" action="/login" id="f" autocomplete="on">
  <div class="brand"><div class="logo">S</div><div><h1>STLIX Hub</h1><small>Everything · One door</small></div></div>

  <label for="u">اسم المستخدم</label>
  <div class="f"><input id="u" name="username" required autocomplete="username" autocapitalize="off" spellcheck="false" autofocus></div>

  <label for="p">كلمة المرور</label>
  <div class="f"><input id="p" name="password" type="password" required autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="إظهار كلمة المرور">👁</button></div>

  <input type="hidden" name="to" id="to" value="/hub/">
  <div class="msg" id="msg"></div>
  <button class="go" type="submit" id="go">دخول</button>
  <div class="foot">الدخول للأدوات الداخلية لـ <span class="en">STLIX Valley</span> — لو معندكش حساب كلّم الـ IT.</div>
</form>
<script>
(function(){
  var q=new URLSearchParams(location.search), msg=document.getElementById('msg');
  var to=q.get('to')||'';
  if(/^\/(?!\/)/.test(to) && !/^\/login/.test(to)) document.getElementById('to').value=to;
  if(q.get('e')){msg.className='msg err';msg.textContent='اسم المستخدم أو كلمة المرور غلط — جرّب تاني.';}
  if(q.get('out')){msg.className='msg ok';msg.textContent='تم تسجيل الخروج.';}
  document.getElementById('eye').onclick=function(){var p=document.getElementById('p');p.type=p.type==='password'?'text':'password';};
  document.getElementById('f').addEventListener('submit',function(){document.getElementById('go').disabled=true;});
})();
</script>
</body>
</html>
